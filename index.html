<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- 認識の安定性を高めるため、arjsにいくつかの推奨設定を追加しています -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- 🛠️ 変更点: フォルダ指定を無くし、トップに置いたオリジナルマーカーを直接読み込みます -->
      <!-- ⚠️ 「pattern-marker.patt」の部分が実際のファイル名と一致しているか確認してください -->
      <a-marker type="pattern" url="pattern-marker.patt">
        
        <!-- 2D画像を表示し、上下に動かすアニメーションを追加 -->
        <a-image 
          src="static/images/test.png" 
          position="0 0.5 0" 
          rotation="-90 0 0" 
          scale="1 1 1"
          animation="property: position; to: 0 0.8 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
        </a-image>

      </a-marker>

      
    </a-scene>
  </body>
</html>
