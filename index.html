<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- 🛠️ 修正点: あなたのGitHubのファイル名「pattern.patt」に完全に合わせました -->
      <a-marker type="pattern" url="pattern.patt">
        
        <!-- 2D画像を表示し、上下に動かすアニメーションを追加 -->
        <a-image 
          src="static/images/test.png" 
          position="0 0.5 0" 
          rotation="-90 0 0" 
          scale="1 1 1"
          animation="property: position; to: 0 0.8 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
        </a-image>

      </a-marker>

      <!-- 🛠️ 修正点: マーカーを認識するために必須のカメラタグを追加しました -->
      
      
    </a-scene>
  </body>
</html>
